[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-map-boundary-analysis"
version = "0.9.0b1"
description = "Typed proof-geometry and theory-catalog diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]
paper = ["pylatexenc==2.11", "pypdf==6.21.4", "jsonschema>=4.23"]
trust = ["cryptography>=46"]
dev = ["pytest>=8", "pytest-cov>=7", "hypothesis>=6", "ruff>=0.14", "mypy>=1.18", "build>=1.2", "twine>=6", "playwright>=1.55", "reportlab>=4", "jsonschema>=4.23"]

[project.scripts]
proofmap = "proofmap.cli:main"

[tool.setuptools.packages.find]
include = ["proofmap*"]

[tool.setuptools.package-data]
"proofmap.resources" = ["*.json", "campaign_operational/*.json", "campaign_operational/*.tex"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
# Parsing runs in a deadline-enforced worker; measure that process as well.
patch = ["subprocess"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[[tool.mypy.overrides]]
module = ["pylatexenc.*"]
ignore_missing_imports = true
