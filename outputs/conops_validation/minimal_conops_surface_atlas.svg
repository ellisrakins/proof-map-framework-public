<text x='95' y='869' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='800' fill='#0b1f4d'>Surface interpretation</text>
<text x='95' y='902' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#32425f'>• Boundary nodes are surface contact points: observations, phenomena, interfaces, gaps, or empirical attachments.</text>
<text x='95' y='927' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#32425f'>• Halos are uncertainty thickness: probability, approximation, measurement, computation, or proof debt.</text>
<text x='95' y='952' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#32425f'>• A rounder map would show shorter, more uniform proof fibers and fewer thick seams or disconnected holes.</text>
<text x='95' y='982' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#14539a'>Proof-depth read:</text>
<text x='220' y='982' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#32425f'>deep boundary points are farther from the compact core; exterior points are unclosed or speculative attachments.</text>
